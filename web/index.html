<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    Базовый путь подставляет сборщик: в корне сайта это "/", при публикации
    в подкаталоге — значение флага --base-href (например, "/pr6/").
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="Магазин кроссовок — учебное приложение на Flutter Web">
  <meta name="theme-color" content="#E64A19">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Магазин кроссовок">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>Магазин кроссовок</title>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #fdf7f4; }

    /*
      Экран-заглушка на время начальной загрузки. Пока скачивается и
      запускается приложение (несколько мегабайт кода и движок отрисовки),
      страница иначе остаётся пустой и белой, и непонятно, работает ли она.
      Вёрстка только на HTML и CSS: Flutter в этот момент ещё не запущен.
    */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #5d4037;
      transition: opacity .25s ease-out;
    }
    #boot.hidden { opacity: 0; pointer-events: none; }
    #boot .name { font-size: 24px; font-weight: 600; letter-spacing: .2px; }
    #boot .hint { font-size: 14px; color: #8d6e63; }
    #boot .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f0d8cc;
      border-top-color: #e64a19;
      border-radius: 50%;
      animation: boot-spin 900ms linear infinite;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #boot .spinner { animation-duration: 3s; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="spinner"></div>
    <div class="name">Магазин кроссовок</div>
    <div class="hint">Загружается приложение…</div>
  </div>

  <script>
    // Заглушка снимается по первому кадру приложения. Запасной таймер нужен
    // на случай, если событие не придёт: иначе заглушка осталась бы висеть
    // поверх работающего приложения.
    (function () {
      var boot = document.getElementById('boot');
      var done = false;
      function hide() {
        if (done || !boot) return;
        done = true;
        boot.classList.add('hidden');
        setTimeout(function () { boot.remove(); }, 300);
      }
      window.addEventListener('flutter-first-frame', hide);
      setTimeout(hide, 20000);
    })();
  </script>

  <!--
    Сборщик кладёт рядом готовый flutter_bootstrap.js: он подхватывает
    настройки сборки и запускает приложение.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
